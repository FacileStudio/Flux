map $sent_http_content_type $flux_cache_control {
    ~^text/html "no-cache";
    default "public, max-age=3600";
}

map $http_cf_connecting_ip $flux_client {
    "" $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_conn_zone $flux_client zone=flux_release_client:10m;
limit_conn_zone $server_name zone=flux_release_total:1m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        include /etc/nginx/flux-headers.conf;
        add_header Cache-Control $flux_cache_control always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /releases/ {
        alias /srv/releases/;
        default_type application/octet-stream;
        limit_conn flux_release_client 4;
        limit_conn flux_release_total 64;
        limit_conn_status 429;
        include /etc/nginx/flux-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition "attachment";
    }

    location ~ ^/releases/(v[0-9][0-9A-Za-z.+-]*)/(SHA256SUMS(?:\.minisig)?)$ {
        alias /srv/releases/$1/$2;
        default_type text/plain;
        charset utf-8;
        include /etc/nginx/flux-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    location /_app/immutable/ {
        include /etc/nginx/flux-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
}
