name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Evaluate every host and package on both systems
        run: nix flake check --no-build --all-systems --print-build-logs

  build:
    name: build (${{ matrix.system }})
    needs: eval
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build every package except the images
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          mapfile -t pkgs < <(nix eval --json ".#packages.$SYSTEM" \
            --apply 'ps: builtins.filter (n: !(builtins.elem n [ "iso" "boite" "vm" ])) (builtins.attrNames ps)' \
            | jq -r '.[]')
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No packages to build on $SYSTEM"
            exit 0
          fi
          printf 'Building %s\n' "${pkgs[@]}"
          nix build --no-link --print-build-logs "${pkgs[@]/#/.#packages.$SYSTEM.}"

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect the site
        id: detect
        run: |
          if [ -f site/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No site/package.json, skipping"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.detect.outputs.present == 'true'
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Check
        if: steps.detect.outputs.present == 'true'
        working-directory: site
        run: |
          if jq -e '.scripts.check' package.json > /dev/null; then
            bun run check
          else
            echo "No check script, skipping"
          fi
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: site
        run: bun run build
      - name: Check the release links
        if: steps.detect.outputs.present == 'true'
        working-directory: site
        run: |
          mapfile -t urls < <(bun -e '
            import * as r from "./src/lib/release.ts";
            for (const url of [r.ISO_X86_64, r.ISO_AARCH64, r.CHECKSUMS, r.RELEASE_NOTES]) console.log(url);
          ')
          if [ "${#urls[@]}" -ne 4 ]; then
            echo "::error::could not read the release links from site/src/lib/release.ts"
            exit 1
          fi
          failed=0
          for url in "${urls[@]}"; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --max-time 30 "$url" || true)
            echo "$code $url"
            [ "$code" = 200 ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::a release link in site/src/lib/release.ts does not answer 200"
            exit 1
          fi
