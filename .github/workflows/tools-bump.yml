name: tools-bump

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump pkgs/facile-tools/tools.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: bot/facile-tools-bump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Lock the latest tool releases
        run: bun scripts/gen-facile-tools.ts
      - name: Open or update the pull request
        run: |
          if git diff --quiet -- pkgs/facile-tools/tools.json; then
            echo "tools.json is up to date"
            exit 0
          fi
          git diff --stat -- pkgs/facile-tools/tools.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add pkgs/facile-tools/tools.json
          git commit -m "build(facile-tools): bump the locked tool releases"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "build(facile-tools): bump the locked tool releases" \
              --body "Generated by the tools-bump workflow from scripts/gen-facile-tools.ts. Review the version changes, then merge."
          fi
